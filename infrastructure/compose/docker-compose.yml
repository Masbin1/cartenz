# LinkedERP AI Development Agent - local development stack.
#
# This is the standard developer path and the basis for the Kubernetes
# manifests. It is authored but has NOT been executed on the host used for the
# foundation milestone, which has no container runtime: see
# docs/adr/ADR-012-local-runtime-without-docker.md. Treat it as unverified until
# a run is recorded in docs/verification-log.md.
#
#   docker compose -f infrastructure/compose/docker-compose.yml up -d --build
#
# Every value comes from the repository-root .env. There are no credentials in
# this file and no defaults for the two secrets.

name: linkederp-ai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkederp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-linkederp_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-linkederp} -d ${POSTGRES_DB:-linkederp_ai}']
      interval: 5s
      timeout: 5s
      retries: 12
    # Not published to the host: only the API and the migration job need it.
    expose:
      - '5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persistence is off deliberately. Redis carries the job queue and the event
    # fan-out; the durable record of a task is in PostgreSQL.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    expose:
      - '6379'

  # Migrations run as a one-shot job rather than on API boot, so that two API
  # replicas starting together cannot race, and so that applying a schema change
  # is a deliberate act.
  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: ['npm', 'run', 'db:migrate']
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkederp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-linkederp_ai}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: ['node', 'dist/main.js']
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkederp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-linkederp_ai}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    expose:
      - '4000'

  # The worker is the same image and the same module graph as the API, started at
  # a different entry point (ADR-016). It publishes no port.
  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkederp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-linkederp_ai}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
    # SIGTERM drains an in-flight job rather than abandoning a task mid-step.
    stop_signal: SIGTERM
    stop_grace_period: 30s

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined at build time, so they are build args
        # rather than runtime environment.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FRONTEND_PORT: '3000'
    expose:
      - '3000'

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${PROXY_PORT:-8080}:80'
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres-data:
