# Certbot needs to write here (ADR-069 / ADR-040), and `ProtectSystem=strict`
# makes the whole filesystem read-only for this unit except the paths listed
# below it.
#
# This is not a permissions problem and it is not fixed by running as root:
# the worker already runs the HTTPS script through its `sudo -n` grant, and
# certbot still failed with
#
#   [Errno 30] Read-only file system: '/var/log/letsencrypt/.certbot.lock'
#
# because the hardening below applies to the *process's mount namespace*, not
# to the user. A root-run child inherits it. Certbot writes its lock, lineage
# and renewal state to three directories outside the provisioning set, so all
# three are granted here:
#
#   /etc/letsencrypt        archives, live symlinks, renewal configs
#   /var/lib/letsencrypt    account registration and working state
#   /var/log/letsencrypt    the lock file the error above names, and its log
#
# `-` prefix: a deployment without certbot installed yet still starts, rather
# than failing because a path in this list does not exist.
[Service]
ReadWritePaths=
ReadWritePaths=-/opt/cartenz/.runtime -/var/log/cartenz -/opt/odoo/projects -/etc/systemd/system -/etc/nginx/sites-available -/etc/nginx/sites-enabled -/var/log/nginx -/etc/letsencrypt -/var/lib/letsencrypt -/var/log/letsencrypt
