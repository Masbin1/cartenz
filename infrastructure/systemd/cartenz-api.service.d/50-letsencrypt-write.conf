# See the worker's copy of this file for the full reasoning. The API unit
# issues certificates too (first-project provisioning, and re-issuance), so it
# needs the same three certbot write paths for the same reason: certbot writes
# where `ProtectSystem=strict` leaves read-only.
#
# `-` prefix: a deployment without certbot installed yet still starts.
[Service]
ReadWritePaths=
ReadWritePaths=-/opt/cartenz/.runtime -/var/log/cartenz -/opt/odoo/projects -/etc/systemd/system -/etc/nginx -/var/lib/nginx -/var/log/nginx -/etc/letsencrypt -/var/lib/letsencrypt -/var/log/letsencrypt -/usr/share/nginx
