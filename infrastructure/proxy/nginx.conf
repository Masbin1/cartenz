# Reverse proxy for the local Compose stack (chapter 16).
#
# One origin serves the portal and the API, so the browser makes no cross-origin
# request and the WebSocket shares the same host and port as the REST calls.
#
# Authored but not verified on the foundation host: see ADR-012.

upstream linkederp_api {
    server api:4000;
}

upstream linkederp_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Do not advertise the proxy version.
    server_tokens off;

    # A prompt may be several kilobytes; a task payload is never large.
    client_max_body_size 1m;

    # The API. Long timeouts are unnecessary here: no request blocks on agent
    # work, because the API enqueues and returns.
    location /api/ {
        proxy_pass http://linkederp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The task event stream. A task runs for minutes and may be idle while it
    # waits for an approval, so the read timeout must outlast the quiet periods.
    location /ws {
        proxy_pass http://linkederp_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Buffering would delay every event by an unpredictable amount.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://linkederp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js uses a WebSocket for hot reload in development.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
