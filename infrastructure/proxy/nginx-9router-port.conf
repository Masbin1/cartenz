# Akses dashboard 9router dari luar host, lewat port sendiri (bukan domain).
#
# Unit 9router tetap bind 127.0.0.1:20128 — Cartenz (baris provider di portal) dan
# Hermes (/opt/cartenz/.hermes/config.yaml) TIDAK perlu diubah sama sekali, karena
# nginx yang meneruskan. Yang berubah hanya cara orang membuka dashboard:
#
#   dari laptop / HP:   http://139.190.96.96:20129
#
# Kenapa lewat nginx dan bukan dengan mengubah HOSTNAME unit ke 0.0.0.0: menyentuh
# unit berarti restart gateway (Cartenz & Hermes ikut terputus sesaat), dan begitu
# unit bind ke semua interface, port 20128 juga terbuka — sedangkan dengan cara ini
# 20128 tetap khusus loopback, dan hanya port baru yang menghadap internet.
#
# Tanpa TLS dan tanpa basic auth (pilihan operator): pelindungnya adalah login
# dashboard 9router sendiri, jadi password dashboard WAJIB terisi — kalau
# /api/auth/status melaporkan hasPassword:false, jangan pasang site ini dulu.
# Lapisan tambahan bisa ditambahkan kapan saja di blok ini:
#   auth_basic "9Router";  auth_basic_user_file /etc/nginx/.htpasswd-9router;
#
# Pemasangan (root, idempoten) / pelepasan:
#   bash /tmp/9router-port/install-9router-port.sh          # pasang
#   bash /tmp/9router-port/remove-9router-port.sh           # lepas

server {
    listen 20129;
    listen [::]:20129;

    server_name _;

    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:20128;
        proxy_http_version 1.1;

        # custom-server.js memakai x-real-ip/x-forwarded-for sebagai IP klien asli
        # (rate limit) — hanya dipercaya karena peer TCP-nya loopback.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (upgrade h2c dari JBR-25) + stream SSE log request.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
